    #start .seal { width: 56px; height: 56px; border: 3px solid #c8302a; color: #e04a3f; background: rgba(11,11,11,.55);

    #start p { font-size: 15px; opacity: .9; text-shadow: 0 1px 8px rgba(0,0,0,.9); max-width: 300px; line-height: 1.5; margin: 0 0 28px; }

      box-shadow: 0 6px 24px rgba(200,48,42,.45); }

    /* Hint while scanning */
    #hint { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(11,11,11,.8); padding: 10px 18px 12px; border-radius: 14px; font-size: 14px;
      display: none; white-space: nowrap; text-align: center; }
    html, body { touch-action: none; -webkit-user-select: none; user-select: none; }
    #arwrap { position: fixed; inset: 0; z-index: 0; transform-origin: 50% 50%; will-change: transform; }
    #zoomTag { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(11,11,11,.75); padding: 6px 14px; border-radius: 14px; font-size: 14px;
      opacity: 0; transition: opacity .3s; pointer-events: none; }
    #loadWrap { width: 220px; margin: 0 auto 18px; }
    #loadBar { height: 4px; background: rgba(243,236,224,.18); border-radius: 2px; overflow: hidden; }
    #loadFill { height: 100%; width: 0%; background: #c8302a; border-radius: 2px; transition: width .25s ease; }
    #loadText { font-size: 12px; letter-spacing: 1px; opacity: .75; margin-top: 8px; }
    #soundBtn { position: fixed; top: 16px; right: 16px; z-index: 11; min-width: 44px; height: 44px;
      border-radius: 22px; font-family: inherit; white-space: nowrap; padding: 0 14px !important; border: 1px solid rgba(243,236,224,.35); background: rgba(11,11,11,.7);
      color: #f3ece0; font-size: 20px; display: none; align-items: center; justify-content: center; padding: 0; }
    #meter { display: none; width: 160px; height: 4px; margin: 8px auto 0; background: rgba(243,236,224,.2);
      border-radius: 2px; overflow: hidden; }
    #meter i { display: block; height: 100%; width: 0%; background: #c8302a; transition: width .15s linear; }

    /* Shop button after the animation */
    #shop { position: fixed; bottom: 24px; left: 16px; right: 16px; z-index: 10; display: none;
      text-align: center; background: rgba(11,11,11,.85); border: 1px solid #c8302a;
      padding: 14px; border-radius: 4px; animation: fadeUp .6s ease; }
    #shop span { display: block; font-size: 14px; opacity: .85; margin-bottom: 8px; }
    #shop a { color: #fff; background: #c8302a; text-decoration: none; padding: 10px 22px;
      display: inline-block; font-size: 15px; letter-spacing: .5px; border-radius: 2px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

<body>

  <div id="start">
    <div class="seal">龍</div>
    <h1>White Dragon</h1>
    <p>Point your camera at your poster and watch it come to life.</p>
    <div id="loadWrap"><div id="loadBar"><div id="loadFill"></div></div><div id="loadText">Loading the magic… 0%</div></div>
    <button id="startBtn" disabled style="opacity:.35">START</button>
    <div style="margin-top:14px;font-size:11px;opacity:.5">v14</div>
  </div>

  <button id="soundBtn" aria-label="Sound">🔊</button>

  <div id="dbg" style="position:fixed;left:8px;right:8px;top:70px;z-index:30;font:12px/1.4 monospace;color:#ffd5cf;background:#300;padding:6px 8px;display:none;white-space:pre-wrap"></div>

  <div id="zoomTag">1.0×</div>

  <div id="hint"><span id="hintText">Point your camera at the poster</span><div id="meter"><i id="meterFill"></i></div></div>

  <div id="shop">
    <span>Love it? Get your own living poster</span>
    <a href="https://steigerstudio.etsy.com" target="_blank" rel="noopener">Visit SteigerStudio →</a>
  </div>

  <script>
    // ---- Error display (helps us find problems on the phone) ----
    function dbg(msg) { const d = document.getElementById('dbg'); if (!d) return; d.style.display = 'block'; d.textContent += msg + '\n'; }
    window.addEventListener('error', e => dbg('JS error: ' + e.message));
    window.addEventListener('unhandledrejection', e => dbg('Promise error: ' + (e.reason && e.reason.message || e.reason)));

    // ---- Settings ----
    // How much of the screen the poster must fill before the animation starts (0.70 = 70%).
    const START_AT = 0.70;
    // Below this the animation hides again (a little lower, so it doesn't flicker at the edge).
    const STOP_AT  = 0.55;
    const POSTER_W = 1, POSTER_H = 1.5;   // 2:3 poster

    const ui = {
      hint: document.getElementById('hint'),
      text: document.getElementById('hintText'),
      meter: document.getElementById('meter'),
      fill: document.getElementById('meterFill'),
      shop: document.getElementById('shop')
    };
    let shopTimer = null;

    function showHint(msg, progress) {
      if (ui.shop.style.display === 'block') { ui.hint.style.display = 'none'; return; }
      ui.hint.style.display = 'block';
      ui.text.textContent = msg;
      if (progress === null) { ui.meter.style.display = 'none'; }
      else { ui.meter.style.display = 'block'; ui.fill.style.width = Math.round(progress * 100) + '%'; }
    }

    // ---- Pinch to zoom (digital zoom: camera image and animation scale together) ----
    const MAX_ZOOM = 3;
    let arZoom = 1, pinchStartDist = 0, pinchStartZoom = 1, tagTimer = null;
    function applyZoom(z) {
      arZoom = Math.min(MAX_ZOOM, Math.max(1, z));
      document.getElementById('arwrap').style.transform = 'scale(' + arZoom + ')';
      const tag = document.getElementById('zoomTag');
      tag.textContent = arZoom.toFixed(1) + '×';
      tag.style.opacity = 1;
      clearTimeout(tagTimer);
      tagTimer = setTimeout(() => { tag.style.opacity = 0; }, 900);
    }
    function touchDist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
    document.addEventListener('touchstart', e => {
      if (e.touches.length === 2) { pinchStartDist = touchDist(e.touches); pinchStartZoom = arZoom; }
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinchStartDist > 0) {
        e.preventDefault();
        applyZoom(pinchStartZoom * touchDist(e.touches) / pinchStartDist);
      }
    }, { passive: false });
    document.addEventListener('touchend', e => { if (e.touches.length < 2) pinchStartDist = 0; });
    // Stop Safari's own page zoom
    ['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

    // ---- Sound (separate from the video, so the camera keeps running on iPhone) ----
    let actx = null, gainNode = null, soundBuf = null, soundSrc = null, soundOn = true;
    function soundStop() {
      if (soundSrc) { try { soundSrc.stop(); } catch (e) {} soundSrc.disconnect(); soundSrc = null; }
    }
    function soundStart(offset) {
      if (!actx || !soundBuf) return;
      soundStop();
      if (actx.state === 'suspended') actx.resume();
      soundSrc = actx.createBufferSource();
      soundSrc.buffer = soundBuf;
      soundSrc.connect(gainNode);
      soundSrc.start(0, Math.max(0, Math.min(offset || 0, soundBuf.duration - 0.05)));
    }

    // Measures how large the poster appears on screen and only plays the video when it is big enough.
    AFRAME.registerComponent('size-gate', {
      init() {
        const w = POSTER_W / 2, h = POSTER_H / 2;
        this.corners = [[-w, h], [w, h], [w, -h], [-w, -h]].map(c => new THREE.Vector3(c[0], c[1], 0));
        this.v = new THREE.Vector3();
        this.found = false;
        this.active = false;
        this.opacity = 0;
        this.video = document.getElementById('anim');
        this.plane = document.getElementById('plane');

        this.el.addEventListener('targetFound', () => { this.found = true; });
        this.el.addEventListener('targetLost', () => {
          this.found = false;
          this.setActive(false);
          showHint('Point your camera at the poster', null);
        });
      },

      setActive(on) {
        if (on === this.active) return;
        this.active = on;
        if (on) {
          this.video.play();
          soundStart(this.video.currentTime);
          ui.hint.style.display = 'none';
          if (!shopTimer) shopTimer = setTimeout(() => { ui.hint.style.display = 'none'; ui.shop.style.display = 'block'; }, 7000);
        } else {
          this.video.pause();
          soundStop();
        }
      },

      coverage() {
        const cam = this.el.sceneEl.camera;
        let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        for (const c of this.corners) {
          this.v.copy(c);
          this.el.object3D.localToWorld(this.v);
          this.v.project(cam);
          minX = Math.min(minX, this.v.x); maxX = Math.max(maxX, this.v.x);
          minY = Math.min(minY, this.v.y); maxY = Math.max(maxY, this.v.y);
        }
        // Screen spans -1..1 in both directions, so divide by 2 to get a 0..1 share of the screen.
        return Math.max((maxX - minX) / 2, (maxY - minY) / 2) * arZoom;
      },

      tick(t, dt) {
        const mesh = this.plane.getObject3D('mesh');
        if (mesh && !mesh.material.transparent) { mesh.material.transparent = true; mesh.material.opacity = 0; }

        // When the video loops back to the start, restart the sound with it
        const ct = this.video.currentTime;
        if (this.active && this.lastT !== undefined && ct + 0.5 < this.lastT) soundStart(ct);
        this.lastT = ct;

        if (this.found) {
          const cover = this.coverage();
          if (!this.active && cover >= START_AT) this.setActive(true);
          else if (this.active && cover < STOP_AT) this.setActive(false);
          if (!this.active) showHint('Move closer to your poster', Math.min(1, cover / START_AT));
        }

        // Smooth fade in / out
        const target = this.active ? 1 : 0;
        this.opacity += (target - this.opacity) * Math.min(1, (dt || 16) / 250);
        if (mesh) { mesh.material.opacity = this.opacity; mesh.visible = this.opacity > 0.01; }
      }
    });
  </script>

  <div id="arwrap">
  <a-scene id="scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiScanning: no; uiLoading: no; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <video id="anim" src="animation.mp4" preload="auto" playsinline webkit-playsinline muted loop crossorigin="anonymous"></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0" size-gate>
      <a-video id="plane" src="#anim" width="1" height="1.5" position="0 0 0"></a-video>
    </a-entity>
  </a-scene>
  </div>

  <script>
    // ---- Sound is switched on only AFTER the camera is running (avoids the white-screen clash on iPhone) ----
    let cameraReady = false;
    const soundBtnEl = document.getElementById('soundBtn');
    function setSoundLabel() {
      if (!actx) soundBtnEl.textContent = '🔇 Tap for sound';
      else soundBtnEl.textContent = soundOn ? '🔊' : '🔇';
    }
    function enableSound() {
      if (actx || !cameraReady) return;
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = actx.createGain(); gainNode.connect(actx.destination);
        actx.resume();
        soundOn = true;
        fetch('sound.m4a').then(r => r.arrayBuffer())
          .then(d => new Promise((ok, fail) => actx.decodeAudioData(d, ok, fail)))
          .then(buf => {
            soundBuf = buf;
            const v = document.getElementById('anim');
            if (!v.paused) soundStart(v.currentTime);
          })
          .catch(() => {});
      } catch (e) { actx = null; }
      setSoundLabel();
    }
    soundBtnEl.addEventListener('click', e => {
      e.stopPropagation();
      if (!actx) { enableSound(); return; }
      soundOn = !soundOn;
      if (gainNode) gainNode.gain.value = soundOn ? 1 : 0;
      if (actx.state === 'suspended') actx.resume();
      setSoundLabel();
    });
    // Any tap on the screen after the camera is up also switches the sound on
    document.addEventListener('touchend', () => { if (cameraReady && !actx) enableSound(); });

    // Keep the camera picture alive (iPhone sometimes pauses it)
    function cameraVideo() { return [...document.querySelectorAll('video')].find(v => v.id !== 'anim'); }
    function kickCamera() { const c = cameraVideo(); if (c && c.paused) c.play().catch(() => {}); }
    document.addEventListener('touchstart', kickCamera, { passive: true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) kickCamera(); });

    // ---- Wait until the AR system is fully loaded before the camera can start ----
    function arSystem() {
      const sc = document.getElementById('scene');
      return sc && sc.hasLoaded && sc.systems && sc.systems['mindar-image-system'];
    }
    function arReadyToStart() { const sys = arSystem(); return !!(sys && sys.ui); }
    let arStarted = false;
    function startWhenReady(tries) {
      tries = tries || 0;
      if (arStarted) return;
      if (arReadyToStart()) {
        arStarted = true;
        try { arSystem().start(); } catch (e) { dbg('AR start failed: ' + e.message); }
      } else if (tries < 300) {
        setTimeout(() => startWhenReady(tries + 1), 100);   // keep checking for up to 30 s
      } else {
        dbg('AR is taking too long to load. Please check your internet connection and reload.');
      }
    }
    // ---- Loading bar: follows the real loading steps, creeping smoothly in between ----
    (function loadingBar() {
      const btn = document.getElementById('startBtn');
      const fill = document.getElementById('loadFill');
      const text = document.getElementById('loadText');
      let shown = 0;
      function stageTarget() {
        if (arReadyToStart()) return 100;                       // AR system ready
        const sc = document.getElementById('scene');
        if (sc && sc.hasLoaded) return 85;                      // 3D scene ready
        if (window.AFRAME && AFRAME.systems && AFRAME.systems['mindar-image-system']) return 60; // AR library loaded
        if (window.AFRAME) return 35;                           // 3D engine loaded
        return 15;
      }
      (function tick() {
        const target = stageTarget();
        if (target === 100) shown = 100;
        else shown = Math.min(target - 1, shown + Math.max(0.3, (target - shown) * 0.08));
        fill.style.width = shown.toFixed(1) + '%';
        if (shown >= 100) {
          text.textContent = 'Ready!';
          btn.disabled = false; btn.style.opacity = 1;
          setTimeout(() => { document.getElementById('loadWrap').style.visibility = 'hidden'; }, 600);
          return;
        }
        text.textContent = 'Loading the magic… ' + Math.floor(shown) + '%';
        setTimeout(tick, 60);
      })();
    })();

    document.getElementById('startBtn').addEventListener('click', () => {
      const scene = document.getElementById('scene');
      scene.addEventListener('arError', () => dbg('Camera could not start. Please allow camera access for Safari (Settings > Safari > Camera) and reload.'));
      scene.addEventListener('arReady', () => {
        cameraReady = true;
        kickCamera();
        soundBtnEl.style.display = 'flex';
        setSoundLabel();
        setTimeout(() => {
          const cam = cameraVideo();
          if (!cam) { dbg('Camera started but camera video is missing'); return; }
          kickCamera();
          const r = cam.getBoundingClientRect();
          if (!cam.videoWidth || r.width < 10) dbg('Camera video not showing: ' + cam.videoWidth + 'x' + cam.videoHeight + ', box ' + Math.round(r.width) + 'x' + Math.round(r.height));
        }, 2500);
      });

      document.getElementById('start').style.display = 'none';
      showHint('Point your camera at the poster', null);

      // 1) camera first - but only once the AR system is fully set up
      startWhenReady();
      // 2) unlock the silent animation video (no sound, no audio session)
      const video = document.getElementById('anim');
      video.play().then(() => { video.pause(); video.currentTime = 0; }).catch(() => {});
    });
  </script>
</body>
</html>
